                            { type: "radio", id: "v3_q14", text: "14. Instrucțiunile cu caracter permanent sunt acele documente ............ pe care comandamentul le emite:", options: { a: "de conducere", b: "care fac referiri la detalii standard", c: "ambele variante sunt corecte" }, correct: "c" },
                            { type: "radio", id: "v3_q15", text: "15. Ordinele cuprind următoarea structură:", options: { a: "situația, misiunea, execuția, sprijinul logistic, comanda și comunicațiile", b: "referințe, misiunea, concepția, sprijinul logistic, coordonarea", c: "situația, misiunea, obiectivele, sprijinul de luptă, sprijinul logistic" }, correct: "a" }
                        ]
                    },
                    {
                        title: "II. Completați denumirea acronimelor:",
                        items: [
                            { type: "text", id: "v3_a1", text: "Ra.A.A.", expected: "Rachete și artilerie antiaeriană" },
                            { type: "text", id: "v3_a2", text: "F.I.A.Bl.", expected: "Forța de intervenție antiblindate" },
                            { type: "text", id: "v3_a3", text: "PAMC", expected: "Punct de adunare materiale contaminate" },
                            { type: "text", id: "v3_a4", text: "RAED", expected: "Raion de adunare a echipamentelor deteriorate" },
                            { type: "text", id: "v3_a5", text: "OPORD", expected: "Ordin de operații" }
                        ]
                    },
                    {
                        title: "III. Materializați grafic pe foaia de lucru:",
                        items: [
                            { type: "graphic", id: "v3_g1", text: "1. Raionul punctului de comandă de bază al batalionului 12 infanterie în care funcționează plutonul 3 Com.Inf. din compania 5 și lângă care este instalat un post de observare de apărare CBRN care execută observarea timp de 6 ore începând cu 16.12.00 05 2025.", expected: "Se desenează P.C. Bază pentru B.12 Inf, cu post observare CBRN alăturat și DTG-ul cerut aplicat." },
                            { type: "graphic", id: "v3_g2", text: "2. Deplasarea, la ordin, a plutonului 2 Com.Inf. din raionul de bază al companiei 10 Com.Inf. în cel de rezervă pe un itinerar cu lungimea de 30 km începând cu data de 14.05.2026, ora 10.00.", expected: "Se trasează săgeata punctată (deplasare viitoare) între raion MAIN și raion REAR, notată cu DTG și L=30km." }
                        ]
                    },
                    {
                        title: "B. TACTICĂ DE SPECIALITATE - Încercuiți răspunsurile considerate corecte:",
                        items: [
                            { type: "radio", id: "v3_s1", text: "1. Care din afirmațiile de mai jos sunt adevărate?", options: { a: "nici o variantă nu este corectă", b: "majoritatea acțiunilor unităților tactice sunt acțiuni ofensive", c: "majoritatea acțiunilor unităților tactice sunt acțiuni defensive" }, correct: "b" },
                            { type: "radio", id: "v3_s2", text: "2. Gama de frecvențe cea mai utilizată în comunicațiile radio ale batalionului de luptă în ofensivă o reprezintă una din următoarele:", options: { a: "VHF", b: "HF" }, correct: "a" },
                            { type: "radio", id: "v3_s3", text: "3. Pentru exploatarea în condiții de securitate și capacitate maximă a autostației radioreleu este încadrată cu un echipaj specializat din arma comunicații și informatică format din:", options: { a: "comandantul plutonului radioreleu", b: "2-3 operatori radio / șeful echipajului" }, correct: "b" },
                            { type: "radio", id: "v3_s4", text: "4. În România, radioreleelor numerice militare le-au fost rezervate următoarele benzi de frecvențe:", options: { a: "Banda I NATO: 225-400 MHz", b: "Banda III NATO: 1350-1850 MHz", c: "Banda V NATO: 5500-7200 MHz" }, correct: "b" },
                            { type: "text", id: "v3_s5", text: "5. Completați elementele care lipsesc din enunțul: \"Autostația radioreleu........... este destinată pentru realizarea legăturilor ................... prin radioreleu, fibră optică și cablu cu curenți purtători...\"", expected: "Radio" },
                            { type: "radio", id: "v3_s6", text: "6. Analizați schema care reprezintă interconectarea autostațiilor... Din figură lipsesc două elemente de comunicații... Care sunt acestea?", options: { a: "autostație radioreleu ARR-II", b: "autostație radioreleu tip I / ARR-I și autostație/stație terminală satelitară / SATCOM", c: "punct de acces radio / PAR" }, correct: "b" },
                            { type: "radio", id: "v3_s7", text: "7. Din punct de vedere funcțional containerul radioreleu este compus din următoarele subsisteme:", options: { a: "subsistemul de management local, subsistemul de interconectare, subsistemul de transport, subsistemul de electroalimentare și electrosecuritate", b: "doar subsistemul de management local", c: "funcția de acoperire radio-relay coverage" }, correct: "a" },
                            { type: "radio", id: "v3_s8", text: "8. O linie radioreleu este realizată din următoarele elemente:", options: { a: "azimutul magnetic și elongația", b: "echipamente (stații) terminale finale", c: "tronsoane (secțiuni)" }, correct: "c" },
                            { type: "radio", id: "v3_s9", text: "9. Care din următoarele elemente nu reprezintă componente tehnico-organizatorice ale SCCB?", options: { a: "subsistemul de comunicații prin mijloace alternative", b: "rezerva de comunicații și informatică", c: "elemente de sprijin logistic" }, correct: "c" },
                            { type: "radio", id: "v3_s10", text: "10. Care din următoarele platforme extinse/WAS sunt disponibile la batalion?", options: { a: "platforma de nivel CC/PC I", b: "platforma de nivel batalion", c: "platforma de nivel companie" }, correct: "b" },
                            { type: "radio", id: "v3_s11", text: "11. Comandantul unității are în PC 80 ofițeri... Să se calculeze numărul de OM și SBB:", options: { a: "21 OM și 11 SBB", b: "22 OM și 11 SBB", c: "20 OM și 10 SBB" }, correct: "b" },
                            { type: "radio", id: "v3_s12", text: "12. În aplicarea măsurilor de protecție a mijloacelor electronice împotriva acțiunii impulsului electromagnetic nuclear sunt cunoscute câteva direcții de realizare printre care:", options: { a: "utilizarea ecranelor nemetalice", b: "utilizarea componentelor din generația întâi", c: "înlocuirea cablurilor din fibră optică cu cabluri metalice", d: "protecția aparaturii existente" }, correct: "d" },
                            { type: "radio", id: "v3_s13", text: "13. Pentru organizarea, instalarea, exploatarea și mentenanța sistemului de comunicații de campanie... se vor lua următoarele măsuri:", options: { a: "se vor lua în calcul posibilitățile utilizării rețelelor de telecomunicații publice", b: "antenele pot fi amplasate lângă turnurile de apă, biserici etc.", c: "stațiile radio se demontează de pe vehicule" }, correct: "a" },
                            { type: "radio", id: "v3_s14", text: "14. La batalionul de luptă plutonul de comunicații și informatică (PL.C.I.) are următoarele misiuni principale:", options: { a: "asigură asistența de specialitate utilizatorilor / abonaților", b: "asigură comunicațiile prin mijloace alternative", c: "sprijină cu forțe și mijloace subunitățile batalionului" }, correct: "b" },
                            { type: "radio", id: "v3_s15", text: "15. Pentru a răspunde cerințelor destinate să asigure sprijinul C2 în/între centrele de conducere/puncte de comandă sunt destinate funcții CIS esențiale. Care din următoarele nu reprezintă o astfel de funcție?", options: { a: "funcția INFOSEC", b: "funcția non-CIS", c: "funcția de realizare a comunicațiilor externe și/sau cu eșalonul superior" }, correct: "b" }
                        ]
                    }
                ]
            }
        };

        let currentVariant = 'variant1';

        window.onload = () => {
            const tabsContainer = document.getElementById('tabs-container');
            
            Object.keys(quizData).forEach((key, index) => {
                const btn = document.createElement('button');
                btn.className = `tab-btn flex-1 py-4 px-6 text-center text-sm md:text-base font-medium text-gray-600 hover:bg-gray-100 transition-colors whitespace-nowrap ${index === 0 ? 'active' : ''}`;
                btn.innerText = quizData[key].title;
                btn.onclick = () => switchTab(key, btn);
                tabsContainer.appendChild(btn);
            });

            renderQuiz(currentVariant);
        };

        function switchTab(variantKey, btnElement) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            currentVariant = variantKey;
            renderQuiz(variantKey);
        }

        function renderQuiz(variantKey) {
            const container = document.getElementById('quiz-container');
            const data = quizData[variantKey];
            container.classList.remove('evaluated');
            
            let html = `<div class="mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
                            <h2 class="text-2xl font-bold border-b pb-2 text-primary w-full md:w-auto">${data.title}</h2>
                            <button onclick="autocompleteQuiz('${variantKey}')" class="bg-purple-600 hover:bg-purple-700 text-white px-5 py-2 rounded-lg shadow-md font-bold transition-transform transform hover:scale-105 flex items-center gap-2">
                                ✨ Autocompletează Testul
                            </button>
                        </div>`;
            
            data.sections.forEach(sec => {
                html += `<div class="bg-gray-800 text-white px-4 py-3 mt-8 rounded-t-lg font-bold uppercase tracking-wide text-sm md:text-base">${sec.title}</div>`;
                html += `<div class="bg-white border border-gray-300 rounded-b-lg p-5 shadow-sm space-y-6">`;

                sec.items.forEach(q => {
                    html += `<div class="question-block" id="block_${q.id}">
                                <p class="font-bold text-gray-800 mb-3 text-[1.05rem]">${q.text}</p>`;

                    if (q.type === 'radio') {
                        html += `<div class="space-y-2 pl-2 md:pl-4">`;
                        Object.keys(q.options).forEach(optKey => {
                            html += `
                                <label class="quiz-option" id="label_${q.id}_${optKey}">
                                    <input type="radio" name="${q.id}" value="${optKey}">
                                    <span class="text-gray-700 font-medium">${optKey}. ${q.options[optKey]}</span>
                                </label>`;
                        });
                        html += `</div>`;
                    } else if (q.type === 'text') {
                        html += `<div class="pl-2 md:pl-4">
                                    <input type="text" id="${q.id}" class="text-input" placeholder="Scrie răspunsul aici...">
                                    <div class="expected-answer">Răspuns Așteptat: ${q.expected}</div>
                                 </div>`;
                    } else if (q.type === 'graphic') {
                        html += `<div class="pl-2 md:pl-4">
                                    <div class="border-2 border-dashed border-gray-300 p-6 rounded text-center text-gray-400 italic mb-2 bg-gray-50">Desenează schema pe foaia de hârtie. (Zonă de simulare)</div>
                                    <textarea id="${q.id}" rows="2" class="text-input" placeholder="Notițe despre schemă..."></textarea>
                                    <div class="expected-answer">Explicație Grafică:<br>${q.expected}</div>
                                 </div>`;
                    }

                    html += `</div>`;
                });

                html += `</div>`;
            });

            html += `
                <div class="mt-10 flex flex-col items-center border-t pt-8 pb-4">
                    <button onclick="evaluateQuiz('${variantKey}')" class="bg-blue-600 hover:bg-blue-700 text-white px-10 py-4 rounded-xl shadow-lg transition-transform transform hover:scale-105 font-bold text-xl w-full md:w-auto flex justify-center items-center gap-2">
                        <span>Evaluează Răspunsurile</span>
                    </button>
                    <div id="results_${variantKey}" class="mt-6 w-full max-w-md text-center hidden">
                        <div class="p-6 rounded-lg bg-gray-50 border-2 border-dashed border-gray-300 shadow-inner">
                            <h3 class="text-2xl font-bold text-gray-800 mb-2">Rezultat Partea Grilă</h3>
                            <p class="text-5xl font-black text-primary" id="score_${variantKey}">0 / 0</p>
                            <p class="text-sm text-gray-600 mt-4 font-semibold">Derulează mai sus pentru a vedea corecturile (cu verde/roșu) sau soluțiile scrise!</p>
                        </div>
                    </div>
                </div>
            `;
            container.innerHTML = html;
        }

        function autocompleteQuiz(variantKey) {
            const data = quizData[variantKey];
            
            // Completam instant campurile corespunzatoare cu raspunsurile din `quizData`
            data.sections.forEach(sec => {
                sec.items.forEach(q => {
                    if (q.type === 'radio') {
                        const radioElement = document.querySelector(`input[name="${q.id}"][value="${q.correct}"]`);
                        if (radioElement) radioElement.checked = true;
                    } else if (q.type === 'text' || q.type === 'graphic') {
                        const textElement = document.getElementById(q.id);
                        if (textElement) textElement.value = q.expected;
                    }
                });
            });

            // Rulează evaluarea ca să arate culorile (10/10 direct)
            evaluateQuiz(variantKey);
        }

        function evaluateQuiz(variantKey) {
            const container = document.getElementById('quiz-container');
            const data = quizData[variantKey];
            let score = 0;
            let totalRadios = 0;

            container.classList.add('evaluated');

            data.sections.forEach(sec => {
                sec.items.forEach(q => {
                    if (q.type === 'radio') {
                        totalRadios++;
                        const radios = document.getElementsByName(q.id);
                        let selectedValue = null;
                        
                        Object.keys(q.options).forEach(optKey => {
                            const label = document.getElementById(`label_${q.id}_${optKey}`);
                            label.classList.remove('option-correct', 'option-error');
                            label.querySelector('span').classList.remove('option-missed');
                        });

                        radios.forEach(r => {
                            if (r.checked) selectedValue = r.value;
                            r.disabled = true; 
                        });

                        const isCorrect = selectedValue === q.correct;
                        
                        if (isCorrect) {
                            score++;
                            document.getElementById(`label_${q.id}_${selectedValue}`).classList.add('option-correct');
                        } else {
                            if (selectedValue) {
                                document.getElementById(`label_${q.id}_${selectedValue}`).classList.add('option-error');
                            }
                            const correctLabel = document.getElementById(`label_${q.id}_${q.correct}`);
                            if(correctLabel) {
                                correctLabel.querySelector('span').classList.add('option-missed');
                            }
                        }
                    } else {
                        const inputElement = document.getElementById(q.id);
                        if(inputElement) inputElement.disabled = true;
                    }
                });
            });

            const resultsDiv = document.getElementById(`results_${variantKey}`);
            const scoreText = document.getElementById(`score_${variantKey}`);
            
            scoreText.innerText = `${score} / ${totalRadios}`;
            resultsDiv.classList.remove('hidden');

            resultsDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    </script>
</body>
</html>
